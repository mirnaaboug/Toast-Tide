<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toast&amp;tide · order online</title>
<meta name="description" content="Toast &amp; Tide, Soma Bay: build-your-own toast, a gluten-free bakery and a Greek yogurt bar. Order ahead.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&amp;family=Work+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#f4e4a6}
*{box-sizing:border-box}
a{color:#7b1e2e}a:hover{color:#5a1420}
button{font-family:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #7b1e2e;outline-offset:3px}
@keyframes tt-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tt-marquee{animation:tt-marquee 30s linear infinite}
@keyframes tt-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.tt-bob{animation:tt-bob 3.4s ease-in-out infinite}
.tt-bob2{animation:tt-bob 3.4s ease-in-out -1.7s infinite}
@keyframes tt-spin{to{transform:rotate(360deg)}}
.tt-spin{animation:tt-spin 26s linear infinite;transform-origin:center;transform-box:fill-box}
@keyframes tt-wobble{0%,100%{transform:rotate(var(--r,-6deg))}50%{transform:rotate(calc(var(--r,-6deg) * -1))}}
.tt-sticker{animation:tt-wobble 4.2s ease-in-out infinite}
@keyframes tt-pop{0%,52%,100%{transform:translateY(74px)}64%{transform:translateY(-50px)}74%{transform:translateY(-26px)}84%{transform:translateY(-36px)}92%{transform:translateY(-30px)}}
.tt-pop1{animation:tt-pop 3.8s cubic-bezier(.3,1.4,.5,1) infinite}
.tt-pop2{animation:tt-pop 3.8s cubic-bezier(.3,1.4,.5,1) .14s infinite}
@keyframes tt-shake{0%,48%,62%,100%{transform:rotate(0)}52%{transform:rotate(-2deg)}56%{transform:rotate(2deg)}}
.tt-shake{animation:tt-shake 3.8s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
.tt-card{transition:transform .4s cubic-bezier(.3,1.7,.5,1)}
.tt-card:hover{transform:translateY(-8px) rotate(-1.4deg)}
@keyframes tt-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.tt-card:hover .tt-doodle{animation:tt-wiggle .6s ease-in-out}
.tt-press{transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.tt-press:hover{transform:scale(1.05) rotate(-1deg)}
.tt-press:active{transform:scale(.94)}
@keyframes tt-bumpA{0%{transform:scale(1)}40%{transform:scale(1.6) rotate(-12deg)}100%{transform:scale(1)}}
@keyframes tt-bumpB{0%{transform:scale(1)}40%{transform:scale(1.6) rotate(12deg)}100%{transform:scale(1)}}
.tt-bumpA{animation:tt-bumpA .5s cubic-bezier(.3,1.6,.5,1)}
.tt-bumpB{animation:tt-bumpB .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes tt-drop{0%{opacity:0;transform:translateY(-110px) rotate(0)}65%{opacity:1;transform:translateY(8px) rotate(var(--r))}100%{opacity:1;transform:translateY(0) rotate(var(--r))}}
.tt-layer{animation:tt-drop .6s cubic-bezier(.3,1.4,.5,1) both}
@keyframes tt-slide{from{transform:translateX(105%)}to{transform:translateX(0)}}
.tt-drawer{animation:tt-slide .5s cubic-bezier(.2,1.15,.4,1)}
@keyframes tt-fade{from{opacity:0}to{opacity:1}}
.tt-fade{animation:tt-fade .3s ease-out}
@keyframes tt-rise{from{opacity:0;transform:translateY(36px) rotate(2deg)}to{opacity:1;transform:none}}
.tt-rise{animation:tt-rise .7s cubic-bezier(.2,1.2,.3,1) both}
@keyframes tt-jump{0%,100%{transform:translateY(0) rotate(-4deg)}40%{transform:translateY(-34px) rotate(6deg)}60%{transform:translateY(-34px) rotate(6deg)}}
.tt-jump{animation:tt-jump 1.3s cubic-bezier(.3,1.5,.5,1) infinite}
@keyframes tt-flash{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08) rotate(-3deg);opacity:1}100%{transform:scale(1) rotate(-3deg);opacity:1}}
.tt-flash{animation:tt-flash .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes tt-knife{0%{transform:translate(40px,68px)}40%{transform:translate(112px,68px)}48%{transform:translate(40px,92px)}88%{transform:translate(112px,92px)}100%{transform:translate(40px,68px)}}
.tt-knife{animation:tt-knife 3.2s ease-in-out infinite}
@keyframes tt-spreadA{0%{stroke-dashoffset:84}40%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:84}}
@keyframes tt-spreadB{0%,48%{stroke-dashoffset:84}88%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:84}}
.tt-spreadA{stroke-dasharray:84;animation:tt-spreadA 3.2s ease-in-out infinite}
.tt-spreadB{stroke-dasharray:84;animation:tt-spreadB 3.2s ease-in-out infinite}
@keyframes tt-loaf{0%{transform:scaleY(.45)}60%,85%{transform:scaleY(1)}100%{transform:scaleY(.45)}}
.tt-loaf{animation:tt-loaf 4s ease-in-out infinite;transform-origin:50% 100%;transform-box:fill-box}
@keyframes tt-heat{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-12px);opacity:0}}
.tt-heat1{animation:tt-heat 2.4s ease-out infinite}
.tt-heat2{animation:tt-heat 2.4s ease-out .8s infinite;opacity:0}
.tt-heat3{animation:tt-heat 2.4s ease-out 1.6s infinite;opacity:0}
@keyframes tt-blink{0%,100%{opacity:1}50%{opacity:.15}}
.tt-blink{animation:tt-blink 1s steps(1) infinite}
@keyframes tt-fall{0%{transform:translateY(0);opacity:0}10%{opacity:1}75%{transform:translateY(56px);opacity:1}85%,100%{transform:translateY(56px);opacity:0}}
.tt-fall1{animation:tt-fall 1.8s ease-in infinite}
.tt-fall2{animation:tt-fall 1.8s ease-in .45s infinite;opacity:0}
.tt-fall3{animation:tt-fall 1.8s ease-in .9s infinite;opacity:0}
.tt-fall4{animation:tt-fall 1.8s ease-in 1.35s infinite;opacity:0}
@keyframes tt-tilt{0%,100%{transform:rotate(-28deg)}50%{transform:rotate(-44deg)}}
.tt-tilt{animation:tt-tilt 1.8s ease-in-out infinite;transform-origin:0% 100%;transform-box:fill-box}
@keyframes tt-pour{0%{stroke-dashoffset:44;opacity:1}20%,70%{stroke-dashoffset:0;opacity:1}85%,100%{stroke-dashoffset:0;opacity:0}}
.tt-pour{stroke-dasharray:44;animation:tt-pour 4s linear infinite}
@keyframes tt-level{0%,15%{transform:translateY(26px)}75%,100%{transform:translateY(0)}}
.tt-level{animation:tt-level 4s ease-in-out infinite}
@keyframes tt-steam{0%,70%{opacity:0;transform:translateY(6px)}85%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.tt-steam{animation:tt-steam 4s ease-out infinite;opacity:0}
@keyframes tt-chop{0%,100%{transform:translateY(0)}40%,55%{transform:translateY(34px)}}
.tt-chop{animation:tt-chop 1.6s cubic-bezier(.5,0,.3,1) infinite}
@keyframes tt-slice{0%,50%{transform:translate(0,0) rotate(0);opacity:1}85%{transform:translate(28px,4px) rotate(16deg);opacity:1}100%{transform:translate(28px,4px) rotate(16deg);opacity:0}}
.tt-slice{animation:tt-slice 1.6s ease-out infinite;transform-origin:0% 100%;transform-box:fill-box}
.tt-blade{animation:tt-spin .35s linear infinite;transform-origin:center;transform-box:fill-box}
@keyframes tt-jiggle{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,1px) rotate(-1.5deg)}50%{transform:translate(2px,-2px) rotate(1deg)}75%{transform:translate(3px,1px) rotate(1.5deg)}}
.tt-jiggle{animation:tt-jiggle .18s linear infinite}
@keyframes tt-whirl{0%{transform:rotate(var(--r)) scale(1);opacity:1}100%{transform:translateY(80px) rotate(540deg) scale(.2);opacity:0}}
.tt-whirl{animation:tt-whirl 1.2s ease-in both}
@keyframes tt-fillup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.tt-fillup{animation:tt-fillup .7s cubic-bezier(.3,1.4,.5,1) both;transform-origin:50% 100%}
@keyframes tt-slosh{0%,100%{transform:translateX(0)}50%{transform:translateX(-30px)}}
.tt-slosh{animation:tt-slosh 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>

</head>
<body>
<div id="app"></div>
<template id="tt-template">

<div style="font-family: 'Work Sans', system-ui, sans-serif; color: #7b1e2e; background: #f4e4a6; min-height: 100vh; overflow-x: hidden">


<header style="padding: 20px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; max-width: 1360px; margin: 0 auto">
<a href="#top" style="text-decoration: none; font-family: 'Bagel Fat One', system-ui, sans-serif; font-size: 36px; letter-spacing: -0.02em; color: #7b1e2e; line-height: 1">toast&amp;tide</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<a href="#menu" class="tt-press" style="display: inline-block; padding: 10px 18px; border-radius: 9999px; font-weight: 700; font-size: 16px; text-decoration: none">menu</a>
<a href="#menu" onClick="{{goBuild}}" class="tt-press" style="display: inline-block; padding: 10px 18px; border-radius: 9999px; font-weight: 700; font-size: 16px; text-decoration: none">build a toast</a>
<button type="button" class="tt-press" onClick="{{openCart}}" aria-label="{{cartAria}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 10px 8px 20px; border: 0; border-radius: 9999px; background: #7b1e2e; color: #fff8e6; font-size: 16px; font-weight: 700">
<span>your tray</span>
<span class="{{bumpClass}}" style="display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 9999px; background: #f4e4a6; color: #7b1e2e; font-size: 14px">{{count}}</span>
</button>
</nav>
</header>


<section id="top" style="max-width: 1360px; margin: 0 auto; padding: 24px 40px 64px; display: flex; flex-wrap: wrap; align-items: center; gap: 40px">
<div class="tt-rise" style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 24px">
<span class="tt-sticker" style="--r: -5deg; display: inline-block; padding: 8px 16px; border-radius: 9999px; background: #9cc5be; color: #5a1420; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em">SOMA BAY · RED SEA · ORDER AHEAD</span>
<h1 style="margin: 0; font-family: 'Bagel Fat One', system-ui, sans-serif; font-weight: 400; font-size: clamp(56px, 8vw, 104px); line-height: 0.95; letter-spacing: -0.02em">no toast left behind</h1>
<p style="margin: 0; max-width: 520px; font-size: 18px; line-height: 28px">Build-your-own toast, a 100% gluten-free bakery and a Greek yogurt bar with house granola. Order here, skip the queue, get back to the beach.</p>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<a href="#menu" class="tt-press" style="display: inline-flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 28px; border-radius: 9999px; background: #7b1e2e; color: #fff8e6; font-weight: 700; font-size: 17px; text-decoration: none">start your order
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
<a href="#menu" onClick="{{goBuild}}" class="tt-press" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 28px; border-radius: 9999px; border: 2px solid #7b1e2e; color: #7b1e2e; font-weight: 700; font-size: 17px; text-decoration: none">build a toast</a>
</div>
</div>

<div style="flex: 1 1 440px; min-width: 0; position: relative; height: 520px; border-radius: 20px; background: #fff8e6; overflow: hidden">
<svg class="tt-spin" style="position: absolute; top: 36px; right: 40px" width="120" height="120" viewBox="0 0 120 120" fill="none" stroke="#7b1e2e" stroke-width="4" stroke-linecap="round" aria-hidden="true">
<circle cx="60" cy="60" r="26"></circle>
<path d="M60 10v14M60 96v14M10 60h14M96 60h14M25 25l10 10M85 85l10 10M95 25L85 35M35 85L25 95"></path>
</svg>
<span class="tt-sticker" style="--r: 8deg; position: absolute; top: 48px; left: 36px; display: inline-flex; align-items: center; justify-content: center; text-align: center; width: 132px; height: 132px; border-radius: 50%; background: #7b1e2e; color: #fff8e6; font-family: 'Bagel Fat One', system-ui, sans-serif; font-size: 24px; line-height: 1; letter-spacing: -0.02em; padding: 16px">rise &amp; dine</span>
<svg style="position: absolute; left: 50%; bottom: 92px; transform: translateX(-50%)" width="320" height="280" viewBox="0 0 320 280" fill="none" stroke="#7b1e2e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="A smiling toaster popping up two slices of toast">
<g class="tt-pop1"><path fill="#fff8e6" d="M80 132V80c-8-3-12-12-6-20 6-8 20-10 36-10s30 2 36 10c6 8 2 17-6 20v52z"></path><path d="M96 74h28" stroke-width="4"></path></g>
<g class="tt-pop2"><path fill="#fff8e6" d="M176 132V80c-8-3-12-12-6-20 6-8 20-10 36-10s30 2 36 10c6 8 2 17-6 20v52z"></path><path d="M192 74h28" stroke-width="4"></path></g>
<g class="tt-shake">
<path fill="#fff8e6" d="M46 120h228c18 0 26 12 26 30v86c0 18-8 24-26 24H46c-18 0-26-6-26-24v-86c0-18 8-30 26-30z"></path>
<path d="M76 136h76M172 136h76"></path>
<circle cx="120" cy="190" r="5" fill="#7b1e2e"></circle><circle cx="200" cy="190" r="5" fill="#7b1e2e"></circle>
<path d="M134 210c14 14 38 14 52 0"></path>
<path d="M300 168h14v18h-14"></path>
<path d="M64 260v12M256 260v12"></path>
</g>
</svg>
<svg class="tt-bob" style="position: absolute; left: -40px; bottom: 34px" width="560" height="56" viewBox="0 0 600 60" fill="none" stroke="#7b1e2e" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M0 30c50-20 100 20 150 0s100-20 150 0 100 20 150 0 100-20 150 0"></path></svg>
<svg class="tt-bob2" style="position: absolute; left: -10px; bottom: 6px" width="560" height="56" viewBox="0 0 600 60" fill="none" stroke="#9cc5be" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M0 30c50-20 100 20 150 0s100-20 150 0 100 20 150 0 100-20 150 0"></path></svg>
<span class="tt-sticker" style="--r: -7deg; position: absolute; right: 28px; bottom: 118px; display: inline-block; padding: 8px 14px; border-radius: 9999px; background: #f4e4a6; border: 2px solid #7b1e2e; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.06em">HOT STUFF. HANDLE WITH HANDS.</span>
</div>
</section>


<div style="background: #7b1e2e; color: #f4e4a6; overflow: hidden; padding: 18px 0" aria-hidden="true">
<div class="tt-marquee" style="display: flex; width: max-content; gap: 40px; align-items: center; font-family: 'Bagel Fat One', system-ui, sans-serif; font-size: 32px; letter-spacing: -0.02em; white-space: nowrap">
<sc-for list="{{marquee}}" as="m" hint-placeholder-count="10">
<span style="display: inline-flex; align-items: center; gap: 40px">{{m}}<svg width="44" height="20" viewBox="0 0 44 20" fill="none" stroke="#f4e4a6" stroke-width="3" stroke-linecap="round"><path d="M2 10c5-7 10 7 15 0s10-7 15 0 7 5 10 0"></path></svg></span>
</sc-for>
</div>
</div>


<section id="menu" style="max-width: 1360px; margin: 0 auto; padding: 88px 40px 64px; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px">
<h2 style="margin: 0; font-family: 'Bagel Fat One', system-ui, sans-serif; font-weight: 400; font-size: 64px; line-height: 1; letter-spacing: -0.02em">what's cooking</h2>
<div role="tablist" aria-label="Stations" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" role="tab" aria-selected="{{t.selected}}" class="tt-press" onClick="{{t.pick}}" style="min-height: 48px; padding: 0 20px; border-radius: 9999px; border: 2px solid #7b1e2e; background: {{t.bg}}; color: {{t.fg}}; font-size: 15px; font-weight: 700">{{t.label}}</button>
</sc-for>
</div>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="1">
<sc-if value="{{g.show}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 24px">
<sc-if value="{{g.hasIntro}}" hint-placeholder-val="{{true}}">
<div class="tt-rise" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px">
<p style="margin: 0; flex: 1 1 320px; max-width: 640px; font-size: 18px; line-height: 28px">{{g.intro}}</p>
<div style="flex: 0 0 auto; width: 240px; height: 168px; border-radius: 20px; border: 2px solid #7b1e2e; background: {{g.panelBg}}; display: flex; align-items: center; justify-content: center; overflow: hidden">
<sc-if value="{{g.isToast}}" hint-placeholder-val="{{true}}">
<svg role="img" aria-label="A knife spreading jam on toast" width="200" height="140" viewBox="0 0 200 140" fill="none" stroke="#7b1e2e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path fill="#f4e4a6" d="M44 134V74c-12-4-16-16-8-26 8-10 28-14 64-14s56 4 64 14c8 10 4 22-8 26v60z"></path>
<path class="tt-spreadA" d="M58 78h84" stroke-width="12"></path>
<path class="tt-spreadB" d="M58 102h84" stroke-width="12"></path>
<g class="tt-knife"><path fill="#fff8e6" d="M2 -8h50v12H8z"></path><path d="M54 -2h30" stroke-width="10"></path></g>
</svg>
</sc-if>
<sc-if value="{{g.isGf}}" hint-placeholder-val="{{false}}">
<svg role="img" aria-label="A loaf rising in the gluten-free oven" width="200" height="140" viewBox="0 0 200 140" fill="none" stroke="#7b1e2e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path class="tt-heat1" d="M72 20c-5-5 5-9 0-14"></path>
<path class="tt-heat2" d="M100 20c-5-5 5-9 0-14"></path>
<path class="tt-heat3" d="M128 20c-5-5 5-9 0-14"></path>
<rect x="28" y="24" width="144" height="112" rx="14" fill="#fff8e6"></rect>
<path d="M28 46h144"></path>
<circle cx="48" cy="35" r="4"></circle><circle cx="64" cy="35" r="4"></circle>
<circle class="tt-blink" cx="152" cy="35" r="4" fill="#7b1e2e"></circle>
<rect x="48" y="56" width="104" height="60" rx="10" fill="#f4e4a6"></rect>
<g class="tt-loaf"><path fill="#fff8e6" d="M64 112v-12c0-14 16-22 36-22s36 8 36 22v12z"></path><path d="M86 88l4 8M100 85l4 8M114 88l3 7" stroke-width="3"></path></g>
<path d="M64 126h72" stroke-width="5"></path>
</svg>
</sc-if>
<sc-if value="{{g.isYogurt}}" hint-placeholder-val="{{false}}">
<svg role="img" aria-label="House granola pouring into a bowl of yogurt" width="200" height="140" viewBox="0 0 200 140" fill="none" stroke="#7b1e2e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<g class="tt-tilt"><path fill="#fff8e6" d="M120 42V16h36v26z"></path><path d="M116 16h44"></path></g>
<circle class="tt-fall1" cx="100" cy="32" r="4" fill="#7b1e2e" stroke="none"></circle>
<rect class="tt-fall2" x="106" y="28" width="7" height="7" rx="2" fill="#7b1e2e" stroke="none"></rect>
<circle class="tt-fall3" cx="94" cy="30" r="5" fill="#fff8e6" stroke-width="3"></circle>
<circle class="tt-fall4" cx="110" cy="34" r="3.5" fill="#7b1e2e" stroke="none"></circle>
<path fill="#fff8e6" d="M36 88h128c0 28-28 46-64 46S36 116 36 88z"></path>
<path d="M48 88c10-6 22-6 32 0s22 6 32 0 22-6 32 0"></path>
</svg>
</sc-if>
<sc-if value="{{g.isDrinks}}" hint-placeholder-val="{{false}}">
<svg role="img" aria-label="Coffee pouring into a cup" width="200" height="140" viewBox="0 0 200 140" fill="none" stroke="#7b1e2e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path fill="#f4e4a6" d="M76 6h48v20H76z"></path>
<path d="M92 26v4M108 26v4"></path>
<path class="tt-pour" d="M100 30v44" stroke-width="5"></path>
<path class="tt-steam" d="M78 62c-4-4 4-8 0-12M122 62c-4-4 4-8 0-12"></path>
<path fill="#fff8e6" d="M60 70h80v30c0 18-16 30-40 30s-40-12-40-30z"></path>
<path d="M140 80c14 0 14 22 0 22"></path>
<path class="tt-level" d="M68 82c10-4 21 4 32 0s21-4 32 0"></path>
</svg>
</sc-if>
<sc-if value="{{g.isSmoothie}}" hint-placeholder-val="{{false}}">
<svg role="img" aria-label="Fruit dropping into a spinning blender" width="200" height="140" viewBox="0 0 200 140" fill="none" stroke="#7b1e2e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<defs><clipPath id="tt-jarclip"><path d="M72 16h56l-8 78H80z"></path></clipPath></defs>
<path d="M66 14h68" stroke-width="6"></path>
<path fill="#fff8e6" d="M70 16h60l-8 80H78z"></path>
<g clip-path="url(#tt-jarclip)"><path class="tt-slosh" fill="#9cc5be" d="M40 64c10-6 20 6 30 0s20-6 30 0 20 6 30 0 20-6 30 0 20 6 30 0V100H40z"></path></g>
<circle class="tt-fall1" cx="92" cy="8" r="6" fill="#fff8e6" stroke-width="3"></circle>

        name: c.name, detail: c.detail, hasDetail: !!c.detail, qty: c.qty, priceText: ttFmt(c.price * c.qty),
        decAria: 'Remove one ' + c.name, incAria: 'Add one more ' + c.name,
        inc: function () { self.qty(c.key, 1); }, dec: function () { self.qty(c.key, -1); }
      };
    });

    var modes = [{ id: 'pickup', label: 'pick up at the counter' }, { id: 'table', label: 'bring it to my table' }].map(function (m) { var p = pill(s.mode === m.id); return { label: m.label, bg: p.bg, fg: p.fg, selected: p.selected, pick: function () { self.setState({ mode: m.id }); } }; });
    var whens = [{ id: 'now', label: 'as soon as it’s ready' }, { id: '15', label: 'in 15 min' }, { id: '30', label: 'in 30 min' }].map(function (w) { var p = pill(s.when === w.id); return { label: w.label, bg: p.bg, fg: p.fg, selected: p.selected, pick: function () { self.setState({ when: w.id }); } }; });

    var needName = !s.name.trim(), needTable = s.mode === 'table' && !s.table.trim();
    var cannotPlace = needName || needTable || s.cart.length === 0;
    var missing = needName ? 'Add your name so we know who to call.' : (needTable ? 'Add your table number.' : '');

    var o = s.order;
    var doneLine = '';
    if (o) {
      var whenTxt = o.when === 'now' ? 'as soon as it’s ready' : 'in about ' + o.when + ' minutes';
      doneLine = o.mode === 'table'
        ? 'Thanks, ' + o.name + '. We’ll bring it to table ' + o.table + ' ' + whenTxt + '. Rise & dine.'
        : 'Thanks, ' + o.name + '. We’ll call your name at the counter ' + whenTxt + '. Rise & dine.';
    }

    var titles = { cart: 'your tray', checkout: 'almost there', done: 'yay!' };

    return {
      showBuilder: s.station === 'buildtoast',
      goBuild: function () { self.setState({ station: 'buildtoast' }); },
      marquee: TT_MARQUEE.concat(TT_MARQUEE),
      tabs: tabs, groups: groups, steps: steps, layers: layers,
      breadLabel: info.b.label, buildPrice: 'EGP ' + info.price, buildEur: '≈ €' + ttEur(info.price),
      builtFlash: s.built, builtIdle: !s.built,
      surprise: function () { self.surprise(); },
      addBuild: function () { self.addBuild(); },
      count: count, cartAria: 'Open your tray, ' + count + ' items',
      bumpClass: s.bump === 0 ? '' : (s.bump % 2 ? 'tt-bumpA' : 'tt-bumpB'),
      open: s.open, vCart: s.view === 'cart', vCheckout: s.view === 'checkout', vDone: s.view === 'done',
      drawerTitle: titles[s.view],
      empty: s.cart.length === 0, notEmpty: s.cart.length > 0, lines: lines, totalText: ttFmt(total),
      openCart: function () { self.setState({ open: true, view: s.view === 'done' ? 'cart' : s.view }); },
      closeCart: function () { self.setState({ open: false, view: s.view === 'done' ? 'cart' : s.view }); },
      toCheckout: function () { self.setState({ view: 'checkout' }); },
      backToCart: function () { self.setState({ view: 'cart' }); },
      orderMore: function () { self.setState({ open: false, view: 'cart' }); },
      name: s.name, table: s.table,
      onName: function (e) { self.setState({ name: e.target.value }); },
      onTable: function (e) { self.setState({ table: e.target.value }); },
      modes: modes, whens: whens, isTable: s.mode === 'table',
      cannotPlace: cannotPlace, placeOpacity: cannotPlace ? 0.45 : 1, missing: missing,
      place: function () { if (!cannotPlace) self.place(); },
      orderNo: o ? o.no : '', doneLine: doneLine
    };
  }
}

ttMount(Component);
</script>
</body>
</html>
